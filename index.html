<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>dh-studio</title>
    <style>
      /* Paints the correct background the instant the HTML parses — before
       * the real stylesheet (and its `bg-background` rule, index.css) has
       * loaded, and before React/the splash screen ever mounts. Without
       * this, the browser's own default (white) shows through for that
       * gap, which in dev mode (non-render-blocking, JS-injected CSS) is
       * long enough to see. Values must mirror index.css's `--background`
       * tokens exactly (a test checks this). */
      html,
      body {
        background: oklch(0.99 0.003 265);
      }
      html.dark,
      html.dark body {
        background: oklch(0.18 0.005 265);
      }
    </style>
    <script>
      // Apply the saved appearance BEFORE first paint so there is no flash of
      // the defaults. Must mirror readMode() in src/shared/theme/theme.tsx and
      // the read* functions in accent.ts, font.ts, corners.ts and scale.ts.
      (function () {
        var root = document.documentElement;
        function get(key) {
          try {
            return localStorage.getItem(key);
          } catch (e) {
            return null;
          }
        }
        function oneOf(value, ids, fallback) {
          return ids.indexOf(value) === -1 ? fallback : value;
        }
        var s = get("darkmode");
        var dark = s === "true";
        if (s !== "true" && s !== "false") {
          try {
            dark = window.matchMedia("(prefers-color-scheme: dark)").matches;
          } catch (e) {}
        }
        if (dark) root.classList.add("dark");
        root.setAttribute(
          "data-accent",
          oneOf(
            get("accent"),
            [
              "blue",
              "graphite",
              "purple",
              "pink",
              "red",
              "orange",
              "yellow",
              "green",
              "teal",
            ],
            "blue",
          ),
        );
        root.setAttribute(
          "data-font",
          get("font") === "system" ? "system" : "plex",
        );
        root.setAttribute(
          "data-corners",
          oneOf(get("cornerStyle"), ["sharp", "soft", "round"], "round"),
        );
        var scaleRaw = get("uiScale");
        var scale = scaleRaw === null ? NaN : Number(scaleRaw);
        if (isFinite(scale)) {
          scale = Math.min(200, Math.max(50, scale));
          if (scale !== 100) root.style.fontSize = scale + "%";
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
