[package]
name = "dh-core"
version = "0.1.0"
edition = "2021"
description = "Shared core for dh-studio: database adapters (SQLite, PostgreSQL, MongoDB), wire API types, activity log, and the SSH tunnel"

[dependencies]
serde.workspace = true
serde_json.workspace = true
sqlx = { workspace = true, features = ["macros"] }
futures-util.workspace = true
libsqlite3-sys.workspace = true
uuid.workspace = true
chrono.workspace = true
rust_decimal.workspace = true
thiserror.workspace = true
async-trait.workspace = true
log.workspace = true
tokio.workspace = true
hex.workspace = true
mongodb.workspace = true
bson.workspace = true
base64.workspace = true
russh.workspace = true

[dev-dependencies]
# russh's key-generation APIs need rand_core 0.10 (russh itself already
# depends on rand 0.10 — this just gives our tests a name to call it by,
# since the workspace `rand` dependency above is pinned to 0.8).
rand10 = { package = "rand", version = "0.10" }
