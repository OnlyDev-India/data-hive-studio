[package]
name = "dh-server"
version = "0.1.0"
edition = "2021"
description = "dh-studio bare proxy: connects the web page to a database, with no accounts and no stored state"

[dependencies]
dh-core = { path = "../dh-core" }
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "net", "time"] }
tower-http.workspace = true
axum.workspace = true
rand.workspace = true
base64.workspace = true
sha2.workspace = true

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
