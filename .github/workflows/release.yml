name: Release

# Runs on every push to main (i.e. every merged PR). Builds nothing unless
# src-tauri/tauri.conf.json's version is newer than the latest GitHub
# Release — merges that don't bump the version are a no-op here.
on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  check-version:
    name: Check version
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.check.outputs.should_build }}
      version: ${{ steps.check.outputs.version }}
      tag: ${{ steps.check.outputs.tag }}
      prerelease: ${{ steps.check.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4

      - name: Determine version and whether a release for it already exists
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(jq -r .version src-tauri/tauri.conf.json)
          TAG="v$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

          if [[ "$VERSION" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists — skipping build."
            echo "should_build=false" >> "$GITHUB_OUTPUT"
          else
            echo "No release for $TAG yet — building."
            echo "should_build=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build (${{ matrix.platform }}${{ matrix.target && format(' / {0}', matrix.target) || '' }})
    needs: check-version
    if: needs.check-version.outputs.should_build == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest # Apple Silicon
            target: aarch64-apple-darwin
          - platform: macos-latest # Intel, cross-compiled from the same arm64 runner
            target: x86_64-apple-darwin
          - platform: ubuntu-22.04
            target: ""
          - platform: windows-latest
            target: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Tauri Linux build dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.platform }}-${{ matrix.target }}

      - run: bun install --frozen-lockfile

      # Unsigned OS build for now (no Apple/Windows CODE-signing secrets
      # configured). macOS Gatekeeper and Windows SmartScreen will warn on
      # first launch. To sign later: add APPLE_CERTIFICATE /
      # APPLE_CERTIFICATE_PASSWORD / APPLE_SIGNING_IDENTITY / APPLE_ID /
      # APPLE_PASSWORD / APPLE_TEAM_ID and/or WINDOWS_CERTIFICATE /
      # WINDOWS_CERTIFICATE_PASSWORD as repo secrets, then pass them through
      # this step's `env` — tauri-action picks them up automatically, no
      # other change needed here.
      #
      # TAURI_SIGNING_PRIVATE_KEY(_PASSWORD) below is a SEPARATE, already-
      # required scheme — the in-app updater's own minisign keypair, not OS
      # code-signing. `bundle.createUpdaterArtifacts: true` (tauri.conf.json)
      # means every build NEEDS these two secrets set to produce the signed
      # update payload + `latest.json` manifest; the build fails without
      # them. Add them once as repo secrets (Settings → Secrets → Actions)
      # from the keypair generated via `bunx tauri signer generate`.
      # (`latest.json` itself needs no extra flag here — tauri-action's
      # `uploadUpdaterJson` input already defaults to true.)
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ needs.check-version.outputs.tag }}
          releaseName: "DH Studio ${{ needs.check-version.outputs.version }}"
          releaseBody: |
            **New**
            - In-app updates: DH Studio now checks for new versions in the background and shows an update icon in the title bar — click it (or Help > Check for Updates…) to see what's new and choose Update or Skip
            - SQL/Mongo console: Run controls moved into a toolbar above the editor with a database picker (Postgres, MongoDB, and MySQL connections' SQL tab) — write `schema.table` directly in the query, and autocomplete/linting now covers every known schema, not just the primary one
            - Command palette: `table:`/`schema:` search now finds tables in other databases on the same connection, not just the one currently active
            - Sidebar: duplicate/drop support for tables in sibling databases and non-active schemas; grid export works for sibling-database tables too
            - Settings: new About section, and a corner-radius style preset under Appearance
            - Local secrets (debug-build fallback credential storage) are now encrypted at rest

            **Fixed**
            - Postgres: connections whose default schema wasn't `public` could show the wrong schema's tables in the command palette and a few other places
            - Sidebar: disconnecting a database no longer leaves a stale "connected" badge behind
            - Command palette: results now show immediately when it opens, instead of only after typing; keyboard navigation no longer gets hijacked when the list scrolls under a stationary mouse

            Full commit history: ${{ github.sha }}

            **macOS:** these builds aren't notarized yet, so opening the app normally after installing will show "**\"DH Studio\" is damaged and can't be opened**." That's Gatekeeper blocking an unsigned app, not actual corruption. Fix (Terminal, one-time): run
            ```
            xattr -cr "/Applications/DH Studio.app"
            ```
            (adjust the path if you installed it elsewhere), then open the app normally.

            **Windows:** SmartScreen will show "Windows protected your PC" since these builds aren't code-signed. Click **More info**, then **Run anyway**. You only need to do this once.

            **Linux:** no extra step needed for the `.deb`/`.rpm` — install via your package manager as usual. If you use the `.AppImage` instead, mark it executable first:
            ```
            chmod +x "DH Studio_${{ needs.check-version.outputs.version }}_amd64.AppImage"
            ```
            then double-click it (or run it) to launch. If it fails with a FUSE error, install `libfuse2` (e.g. `sudo apt install libfuse2` on Ubuntu 22.04+) first.
          releaseDraft: false
          prerelease: ${{ needs.check-version.outputs.prerelease }}
          args: ${{ matrix.target && format('--target {0}', matrix.target) || '' }}
