name: Release

# Runs on every push to main (i.e. every merged PR). Builds nothing unless
# src-tauri/tauri.conf.json's version is newer than the latest GitHub
# Release — merges that don't bump the version are a no-op here.
on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  check-version:
    name: Check version
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.check.outputs.should_build }}
      version: ${{ steps.check.outputs.version }}
      tag: ${{ steps.check.outputs.tag }}
      prerelease: ${{ steps.check.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4

      - name: Determine version and whether a release for it already exists
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(jq -r .version src-tauri/tauri.conf.json)
          TAG="v$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

          if [[ "$VERSION" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists — skipping build."
            echo "should_build=false" >> "$GITHUB_OUTPUT"
          else
            echo "No release for $TAG yet — building."
            echo "should_build=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build (${{ matrix.platform }}${{ matrix.target && format(' / {0}', matrix.target) || '' }})
    needs: check-version
    if: needs.check-version.outputs.should_build == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest # Apple Silicon
            target: aarch64-apple-darwin
          - platform: macos-latest # Intel, cross-compiled from the same arm64 runner
            target: x86_64-apple-darwin
          - platform: ubuntu-22.04
            target: ""
          - platform: windows-latest
            target: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Tauri Linux build dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.platform }}-${{ matrix.target }}

      - run: bun install --frozen-lockfile

      # Unsigned OS build for now (no Apple/Windows CODE-signing secrets
      # configured). macOS Gatekeeper and Windows SmartScreen will warn on
      # first launch. To sign later: add APPLE_CERTIFICATE /
      # APPLE_CERTIFICATE_PASSWORD / APPLE_SIGNING_IDENTITY / APPLE_ID /
      # APPLE_PASSWORD / APPLE_TEAM_ID and/or WINDOWS_CERTIFICATE /
      # WINDOWS_CERTIFICATE_PASSWORD as repo secrets, then pass them through
      # this step's `env` — tauri-action picks them up automatically, no
      # other change needed here.
      #
      # TAURI_SIGNING_PRIVATE_KEY(_PASSWORD) below is a SEPARATE, already-
      # required scheme — the in-app updater's own minisign keypair, not OS
      # code-signing. `bundle.createUpdaterArtifacts: true` (tauri.conf.json)
      # means every build NEEDS these two secrets set to produce the signed
      # update payload + `latest.json` manifest; the build fails without
      # them. Add them once as repo secrets (Settings → Secrets → Actions)
      # from the keypair generated via `bunx tauri signer generate`.
      # (`latest.json` itself needs no extra flag here — tauri-action's
      # `uploadUpdaterJson` input already defaults to true.)
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ needs.check-version.outputs.tag }}
          releaseName: "DH Studio ${{ needs.check-version.outputs.version }}"
          releaseBody: |
            **New**
            - Connections: a new two step connection form, and tabs pause after a disconnect and pick up where you left off when you reconnect
            - Connections: mark a connection read only and give it an environment label, shown as a badge in the sidebar
            - Query editor: Stop a running query on SQLite, PostgreSQL and MongoDB
            - Query editor: Explain plan view for Postgres, SQLite and MongoDB
            - Query editor: results stream in batches, and each result shows a summary, the query that produced it, and a file breadcrumb
            - Import: bring data into tables and collections with a five step wizard and flexible column mapping, also available from the new table tab
            - New table: tabs for indexes, foreign keys and constraints, and suggested default values
            - Data grid: a shortcut to reload the table, and a loading state while data loads
            - Data grid: the column header shows name and type, and the date picker has scrolling hour and minute lists
            - Table schema view now uses tabs
            - Updater: updates download inside the app and install when you restart or quit
            - Windows and Linux: the title bar has the same menus as macOS
            - Team server: now a simple proxy with no sign in

            **Fixes**
            - Checkboxes in table cells now work correctly
            - The import dialog no longer scrolls sideways
            - Auto Increment can only be turned on for columns that support it
            - MongoDB date columns use the date and time editor and are saved back as real dates
            - The grid header and rows keep their height when no columns are visible
            - The Columns menu selects a column when you click its name, and shows where it will land while you drag it
            - Smaller fixes in the SQL editor, schema designer, JSON viewer and settings dialog

            Full commit history: ${{ github.sha }}

            **macOS:** these builds aren't notarized yet, so opening the app normally after installing will show "**\"DH Studio\" is damaged and can't be opened**." That's Gatekeeper blocking an unsigned app, not actual corruption. Fix (Terminal, one-time): run
            ```
            xattr -cr "/Applications/DH Studio.app"
            ```
            (adjust the path if you installed it elsewhere), then open the app normally.

            **Windows:** SmartScreen will show "Windows protected your PC" since these builds aren't code-signed. Click **More info**, then **Run anyway**. You only need to do this once.

            **Linux:** no extra step needed for the `.deb`/`.rpm` — install via your package manager as usual. If you use the `.AppImage` instead, mark it executable first:
            ```
            chmod +x "DH Studio_${{ needs.check-version.outputs.version }}_amd64.AppImage"
            ```
            then double-click it (or run it) to launch. If it fails with a FUSE error, install `libfuse2` (e.g. `sudo apt install libfuse2` on Ubuntu 22.04+) first.
          releaseDraft: false
          prerelease: ${{ needs.check-version.outputs.prerelease }}
          args: ${{ matrix.target && format('--target {0}', matrix.target) || '' }}

  # tauri-action copies the whole release body into latest.json's `notes`,
  # which the in-app updater shows. Keep only the part above "Full commit
  # history:" once every build has written its platform entry.
  trim-updater-notes:
    name: Trim updater notes
    needs: [check-version, build]
    if: ${{ !cancelled() && needs.check-version.outputs.should_build == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Cut latest.json notes at "Full commit history:"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.check-version.outputs.tag }}
        run: |
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern latest.json --dir out
          jq '.notes |= (split("Full commit history:")[0] | sub("\\s+$"; ""))' out/latest.json > latest.json
          gh release upload "$TAG" latest.json --repo "$GITHUB_REPOSITORY" --clobber
