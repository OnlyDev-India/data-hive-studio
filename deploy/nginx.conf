# dh-studio web UI — SPA with API reverse-proxy.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip text payloads.
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Immutable hashed assets get long cache; index.html revalidates.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Team-server API → dh-studio-server:8080 (compose network).
    location /v1/ {
        proxy_pass http://server:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 300s;   # room for slow gateway queries
    }

    # SPA fallback: every unknown path serves the shell.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
