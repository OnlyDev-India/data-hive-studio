[package]
name = "dh-studio"
version = "0.3.0"
description = "DH Studio — a native desktop client for SQLite, PostgreSQL, and MongoDB"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
dh-core = { path = "../crates/dh-core" }
serde.workspace = true
serde_json.workspace = true
log.workspace = true
keyring = { version = "3", features = ["apple-native", "windows-native", "linux-native"] }
uuid.workspace = true
tauri = { version = "2.11.3", features = [] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
tauri-plugin-window-state = "2.4.1"

# Windows only: simulates the native Win+Z shortcut so hovering our custom
# maximize button shows the real Snap Layout flyout (see
# `show_snap_overlay` in commands.rs) — decorations:false on Windows means
# there's no native maximize caption button for the DWM shell to hook hover
# detection onto, so this is the same trick tauri-plugin-decorum uses
# internally, without pulling in that plugin's own titlebar DOM/CSS.
[target.'cfg(target_os = "windows")'.dependencies]
enigo = "0.6"
