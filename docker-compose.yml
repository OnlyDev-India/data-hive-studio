# dh-studio: two services.
#
#   web     nginx SPA + /v1 reverse-proxy   ->  http://localhost:8080
#   server  the proxy (internal only)       ->  reachable as http://server:8080
#
#   docker compose up --build      # start
#   docker compose down            # stop
#
# The server has no accounts and no database of its own: the page keeps the
# saved connections in the browser and sends them to the server when it
# connects. See crates/dh-server/src/main.rs for every setting.
#
# The server connects to any database it can reach, so put DH_ACCESS_KEY on it
# before exposing this to anyone you do not trust. The page asks for the key
# once per tab.

services:
  server:
    build:
      context: .
      dockerfile: Dockerfile
    image: dh-studio-server
    container_name: dh-studio-server
    environment:
      DH_BIND: 0.0.0.0:8080
      # Shared secret every /v1 call (except /v1/info) must send.
      DH_ACCESS_KEY: ${DH_ACCESS_KEY:-}
      # The public address people use, when it is not localhost. Its host is
      # allowed in the Host check; any other Host gets a 403.
      # DH_PUBLIC_URL: https://studio.example.com
      # Set to 1 to refuse every write.
      # DH_READ_ONLY: "1"
    expose:
      - "8080" # internal only: reached through the `web` proxy
    restart: unless-stopped
    healthcheck:
      # /dev/tcp is a bash-only builtin, so run via bash. /v1/info is open even
      # when an access key is set.
      test:
        - CMD
        - bash
        - -c
        - 'exec 3<>/dev/tcp/127.0.0.1/8080 && printf "GET /v1/info HTTP/1.0\r\nHost: localhost\r\n\r\n" >&3 && grep -q "200" <&3'
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    image: dh-studio-web
    container_name: dh-studio-web
    ports:
      - "8080:80" # the single URL people open: http://localhost:8080
    depends_on:
      server:
        condition: service_healthy
    restart: unless-stopped
